name: Build WarungOS APK

on:
  push:
    branches:
      - main
      - codex/retest

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:***@localhost:5432/postgres"
          BETTER_AUTH_SECRET: "mock_better_auth_secret_for_github_actions_build"
          NEXT_PUBLIC_APP_URL: "https://miejebew.my.id"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warungos-kasir
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish APK to Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail

          API="https://api.github.com"
          OWNER_REPO="${{ github.repository }}"

          get_release() {
            curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${OWNER_REPO}/releases/tags/latest" || true
          }

          RELEASE_INFO=$(get_release)

          extract() {
            echo "$1" | grep -oP '"'$2'":\s*"\K[^"]+' | head -n 1
          }

          if echo "${RELEASE_INFO}" | grep -q '"id"'; then
            RELEASE_ID=$(extract "${RELEASE_INFO}" "id")
            ASSET_IDS=$(echo "${RELEASE_INFO}" | grep -oP '"id":\s*\K[0-9]+' | head -n 1)
          else
            PAYLOAD=$(jq -n \
              --arg tag_name "latest" \
              --arg name "Latest Build" \
              --arg body "Automatically updated APK from main branch." \
              '{tag_name:$tag_name, name:$name, body:$body, draft:false, prerelease:false}')
            CREATE_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${API}/repos/${OWNER_REPO}/releases")
            RELEASE_ID=$(extract "${CREATE_RESPONSE}" "id")
          fi

          if [ -n "${RELEASE_ID:-}" ]; then
            ASSET_LIST=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${OWNER_REPO}/releases/${RELEASE_ID}/assets?per_page=100")
            ASSET_ID=$(echo "${ASSET_LIST}" | grep -o '^{\"id":[0-9]\+,.*"name":"app-debug.apk"' | grep -oP '"id":\s*\K[0-9]+' | head -n 1 || true)
            if [ -n "${ASSET_ID:-}" ]; then
              curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${API}/repos/${OWNER_REPO}/releases/${RELEASE_ID}/assets/${ASSET_ID}" | grep -q "^2" || true
            fi
          fi

          UPLOAD_URL="https://uploads.github.com/repos/${OWNER_REPO}/releases/${RELEASE_ID}/assets?name=app-debug.apk"
          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"${APK_PATH}" \
            "${UPLOAD_URL}" >/dev/null
