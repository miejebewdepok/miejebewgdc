name: Build WarungOS APK

on:
  push:
    branches:
      - main
      - codex/retest

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: "postgresql://postgres:***@localhost:5432/postgres"
          BETTER_AUTH_SECRET: "mock_better_auth_secret_for_github_actions_build"
          NEXT_PUBLIC_APP_URL: "https://miejebew.my.id"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Android Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warungos-kasir
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Publish APK to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing latest release and remote tag to avoid collision
          gh release delete latest --yes --cleanup-tag || true
          
          # Create fresh release and upload compiled APK asset
          gh release create latest android/app/build/outputs/apk/release/app-release.apk \
            --title "Latest Build" \
            --notes "Automatically updated APK from main branch." \
            --prerelease=false
